name: publish-app

on:
  workflow_dispatch:
    inputs:
      build_mac:
        type: boolean
        default: true
      build_window:
        type: boolean
        default: true

env:
  R2_DEFAULT_REGION: ${{ vars.R2_DEFAULT_REGION }}
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  FEED_BASE_URL: ${{ vars.FEED_BASE_URL }}
  DEV_USE_BETA_LANE: ${{ github.ref_name != 'release' && 't' }}

jobs:
  deploy-mac:
    runs-on: macos-latest
    if: inputs.build_mac == true
    steps:
      - name: Echo Settings
        run: |
          echo "R2 - ${{ env.R2_DEFAULT_REGION }}/${{ env.R2_BUCKET }}"
          echo "Update lane - ${{ env.DEV_USE_BETA_LANE == 't' && 'beta' || 'production' }}"

      - name: Github checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Add osx certs
        run: |
          chmod +x ./build/add-osx-cert.sh
          ./build/add-osx-cert.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare for app notarization (mac)
        run: echo "${{ secrets.APPLE_API_KEY }}" | base64 -d > ./AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Install Packages
        run: npm ci

      - name: Publish app
        run: npm run publish-app -- --arch universal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY}}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_APP_BUNDLE_ID: ${{ vars.APPLE_APP_BUNDLE_ID }}

  deploy-windows:
    runs-on: windows-latest
    if: inputs.build_window == true
    steps:
      - name: Echo Settings
        run: |
          echo "R2 - ${{ env.R2_DEFAULT_REGION }}/${{ env.R2_BUCKET }}"
          echo "Update lane - ${{ env.DEV_USE_BETA_LANE == 't' && 'beta' || 'production' }}"

      - name: Github checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install Azure Trusted Signing Client
        run: |
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.95 -OutputDirectory ${{ runner.temp }}\TrustedSigning
          $dllPath = "${{ runner.temp }}\TrustedSigning\Microsoft.Trusted.Signing.Client.1.0.95\bin\x64\Azure.CodeSigning.Dlib.dll"
          echo "AZURE_CODE_SIGNING_DLIB=$dllPath" >> $env:GITHUB_ENV

      - name: Find signtool.exe
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Where-Object { $_.FullName -like "*\x64\*" } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          echo "SIGNTOOL_PATH=$signtool" >> $env:GITHUB_ENV

      - name: Install Packages
        run: npm ci

      - name: Publish app
        run: npm run publish-app
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY}}
